name: qr_barcode_toolkit
description: Offline-first QR & Barcode scan/generate/history toolkit.
publish_to: 'none'
version: 0.0.6+6

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # Translations of Flutter's own widgets (dialog buttons, tooltips, ...)
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # Scanning
  mobile_scanner: ^7.4.2
  image_picker: ^1.1.2

  # Generation
  qr_flutter: ^4.1.0
  barcode_widget: ^2.0.4
  barcode: ^2.2.8

  # Permissions
  permission_handler: ^11.3.1

  # Ads
  google_mobile_ads: ^9.1.0

  # Storage / persistence
  shared_preferences: ^2.2.3
  path_provider: ^2.1.3
  gal: ^2.3.0

  # Sharing
  share_plus: ^13.3.1

  # Opening scanned links safely
  url_launcher: ^6.3.0

  # One-time Pro purchase (Google Play Billing)
  in_app_purchase: ^3.2.0

  # App version display in Settings
  package_info_plus: ^10.2.2

  # Google's in-app rating sheet (shown rarely, after the user got value)
  in_app_review: ^2.0.9

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
