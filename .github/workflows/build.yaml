name: Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch: {}

jobs:
  # Runs on every push to main. Needs NO secrets. Produces an installable
  # debug APK for quick device testing.
  debug-apk:
    if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Analyze (non-blocking for now)
        run: flutter analyze || true

      - run: flutter build apk --debug

      - uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14

  # Runs on version tags (git tag v0.1.0 && git push --tags) or manually from
  # the Actions tab. Builds the SIGNED app bundle (.aab) that Play requires.
  release-aab:
    if: ${{ startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Release safety checks
        run: |
          if grep -q "useTestAds = true" lib/services/ad_service.dart; then
            echo "::warning::AdService.useTestAds is still true - this build shows Google TEST ads (fine for internal testing, NOT for production)."
          elif grep -q "REPLACE_WITH_YOUR_BANNER_AD_UNIT_ID" lib/services/ad_service.dart; then
            echo "::error::useTestAds is false but the banner ad unit ID is still the placeholder."
            exit 1
          fi
          if grep -rq "3940256099942544~3347511713" android/app/src/main/AndroidManifest.xml; then
            echo "::warning::AndroidManifest still has the AdMob TEST app ID."
          fi
          if grep -rq "example.com" lib/screens/settings_screen.dart; then
            echo "::warning::Placeholder privacy policy / support email (example.com) still in settings_screen.dart."
          fi

      - name: Restore upload keystore from secrets
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_PASSWORD" ] || [ -z "$KEY_ALIAS" ]; then
            echo "::error::Missing signing secrets. See RELEASE_SIGNING.md (ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_PASSWORD, ANDROID_KEY_ALIAS)."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > android/app/upload-keystore.jks
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=upload-keystore.jks\n' \
            "$STORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" > android/key.properties

      # build-number must increase on every Play upload. The run number is
      # monotonic, so it can never collide with a previous upload.
      - name: Build signed app bundle
        run: flutter build appbundle --release --build-number=${{ github.run_number }}

      - uses: actions/upload-artifact@v4
        with:
          name: release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 30
